<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App-Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<body>
    <header>
        <div class="navbar">
            <a href="#content">Games</a>
            <a href="#self">Self</a>
            <a href="#college">College</a>
            <a href="#">Workout</a>
            <a href="#">Books</a>
        </div>
    </header>

    <div class="games-divider">
        <span>✦</span>
        <h2>GAMES</h2>
        <span>✦</span>
    </div>

    <content id="content">
        <div id="game"><a id="val" href="riotclient://launch">Valorant</a></div>
        <div id="game1"><a id="mine" href="shell:AppsFolder">Minecraft</a></div>
        <div id="game2"><a id="chess" href="https://www.chess.com/play/online">Chess</a></div>
    </content>

    <div class="section-divider">
        <span>✦</span>
        <h2>SELF</h2>
        <span>✦</span>
    </div>
    
    <div id="self">
        <div id="youtube"><a id="yt" href="https://www.youtube.com/"><i class="fa-brands fa-youtube"></i>YouTube</a></div>
        <div id="crunchyroll"><a id="cr" href="https://www.crunchyroll.com/">Crunchyroll</a></div>
    </div>

    <div class="college-divider">
        <span>✦</span>
        <h2>COLLEGE</h2>
        <span>✦</span>
    </div>

    <div id="college">
        <div id="classroom"><a id="gc" href="https://classroom.google.com/u/0/a/not-turned-in/all">Google Classroom</a></div>
        <div id="chatgpt"><a id="gpt" href="https://chatgpt.com/">ChatGPT</a></div>
        <div id="claude"><a id="cl" href="claude://claude.ai/new">Claude</a></div>
        <div id="github"><a id="git" href="https://github.com/Sujalkapal">GitHub</a></div>
    </div>

    
    <footer></footer>
</body>
</html>
